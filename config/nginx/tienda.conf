# lim-lb-01: entrada HTTPS de la tienda y reparto de trafico entre lim-web-01 y lim-web-02

upstream tienda {
    server lim-web-01:80;
    server lim-web-02:80;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost tienda.andesmarket.local;

    ssl_certificate     /etc/nginx/certs/tienda.crt;
    ssl_certificate_key /etc/nginx/certs/tienda.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    # Cabecera para saber que servidor respondio (util al diagnosticar)
    add_header X-Servidor $upstream_addr always;

    location / {
        proxy_pass http://tienda;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
