# AndesMarket S.A.C. - Fase 1: redes y tienda web
# Uso: ./lab.sh iniciar 1   (no hace falta llamar a docker compose a mano)

name: andesmarket

networks:
  dmz:
    name: andes-dmz
    ipam:
      config:
        - subnet: 10.10.10.0/24
  servidores:
    name: andes-servidores
    internal: true          # sin salida a internet, como una red interna real
    ipam:
      config:
        - subnet: 10.10.20.0/24

volumes:
  tienda-html:
  tienda-db:
  dc-datos:
  dc-config:

services:
  lim-lb-01:
    image: nginx:stable-alpine
    container_name: lim-lb-01
    hostname: lim-lb-01
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ../config/nginx/tienda.conf:/etc/nginx/conf.d/default.conf:ro
      - ../config/nginx/certs:/etc/nginx/certs:ro
    networks:
      dmz:
        ipv4_address: 10.10.10.10
    depends_on:
      lim-web-01:
        condition: service_healthy
      lim-web-02:
        condition: service_started

  lim-web-01:
    image: wordpress:php8.3-apache
    container_name: lim-web-01
    hostname: lim-web-01
    restart: unless-stopped
    environment: &wordpress-env
      WORDPRESS_DB_HOST: lim-db-02
      WORDPRESS_DB_NAME: ${TIENDA_DB_NAME}
      WORDPRESS_DB_USER: ${TIENDA_DB_USER}
      WORDPRESS_DB_PASSWORD: ${TIENDA_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('WP_HOME', '${TIENDA_URL}');
        define('WP_SITEURL', '${TIENDA_URL}');
    volumes:
      - tienda-html:/var/www/html
    networks:
      dmz:
        ipv4_address: 10.10.10.11
      servidores:
        ipv4_address: 10.10.20.11
    depends_on:
      lim-db-02:
        condition: service_healthy
    healthcheck:
      # wp-config.php existe cuando la imagen termino de copiar WordPress al volumen
      test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
      interval: 5s
      retries: 30

  lim-web-02:
    image: wordpress:php8.3-apache
    container_name: lim-web-02
    hostname: lim-web-02
    restart: unless-stopped
    environment: *wordpress-env
    volumes:
      - tienda-html:/var/www/html
    networks:
      dmz:
        ipv4_address: 10.10.10.12
      servidores:
        ipv4_address: 10.10.20.12
    depends_on:
      # arranca despues para no copiar WordPress dos veces al mismo volumen
      lim-web-01:
        condition: service_healthy

  lim-db-02:
    image: mysql:8.4
    container_name: lim-db-02
    hostname: lim-db-02
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${TIENDA_DB_NAME}
      MYSQL_USER: ${TIENDA_DB_USER}
      MYSQL_PASSWORD: ${TIENDA_DB_PASSWORD}
    volumes:
      - tienda-db:/var/lib/mysql
      - ../config/mysql/tienda.cnf:/etc/mysql/conf.d/tienda.cnf:ro
    networks:
      servidores:
        ipv4_address: 10.10.20.22
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 30

  lim-dc-01:
    build: ../config/samba
    image: andesmarket/samba-ad:1
    container_name: lim-dc-01
    hostname: lim-dc-01
    domainname: andesmarket.local
    restart: unless-stopped
    # Samba guarda permisos de Windows en atributos extendidos del disco;
    # escribirlos necesita esta capacidad del kernel.
    cap_add:
      - SYS_ADMIN
    environment:
      SAMBA_ADMIN_PASSWORD: ${SAMBA_ADMIN_PASSWORD}
      SAMBA_USERS_PASSWORD: ${SAMBA_USERS_PASSWORD}
    volumes:
      - dc-datos:/var/lib/samba
      - dc-config:/etc/samba
      - ../config/samba/usuarios.csv:/config/usuarios.csv:ro
    networks:
      servidores:
        ipv4_address: 10.10.20.41
    healthcheck:
      # sano cuando escuchan LDAP (389) y SMB (445)
      test: ["CMD-SHELL", "ss -ltn | grep -q ':389 ' && ss -ltn | grep -q ':445 '"]
      interval: 10s
      start_period: 60s
      retries: 12

  # Herramienta de administracion de WordPress. Solo corre cuando se la llama:
  #   ./lab.sh wp plugin list
  wp-cli:
    image: wordpress:cli-php8.3
    profiles: ["herramientas"]
    user: "33:33"
    environment: *wordpress-env
    volumes:
      - tienda-html:/var/www/html
    networks:
      - dmz
      - servidores
